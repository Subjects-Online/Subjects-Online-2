<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects Online — Your Gateway to Knowledge</title>
    <meta name="description" content="Subjects Online">

    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            300: '#7dd3fc',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        accent: {
                            purple: '#a855f7',
                            indigo: '#6366f1',
                            cyan: '#06b6d4',
                        }
                    },
                    fontFamily: {
                        heading: ['"Playfair Display"', 'Georgia', 'serif'],
                        body: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/splash.css">
    <link rel="stylesheet" href="css/mobile-perf.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1b3e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Subjects Online">
    <link rel="apple-touch-icon" href="images/icon-512.png"></head>

<body class="bg-slate-50 font-body antialiased text-slate-900 overflow-hidden">

    <!-- ===== SPLASH SCREEN ===== -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center overflow-hidden select-none" style="background-color: #080c14;">
        
        <!-- Subtle Background Glow -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[120px] opacity-60"></div>
        </div>

        <!-- Centerpiece: Logo and Brand -->
        <div class="relative z-10 flex flex-col items-center">
            
            <!-- Logo Mark -->
            <div class="splash-logo-mark mb-8 flex items-center justify-center">
                <span class="splash-logo-letter">S</span>
            </div>
            
            <!-- Brand Text -->
            <div class="splash-brand-text flex items-baseline gap-2 md:gap-3">
                <span class="font-heading text-3xl md:text-5xl font-bold text-white tracking-tight">Subjects</span>
                <span class="font-heading text-3xl md:text-5xl font-light text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">Online</span>
            </div>
            
            <!-- Loading Bar -->
            <div class="splash-loading-wrap mt-12">
                <div class="splash-loading-bar"></div>
            </div>

        </div>

        <!-- Bottom branding -->
        <div class="absolute bottom-8 text-center z-10 w-full splash-bottom-text">
            <p class="text-[10px] tracking-[0.2em] uppercase text-white/30 font-body font-medium">
                Enterprise Educational Platform
            </p>
        </div>
    </div>

    <script src="js/splash.js"></script>
<!-- Firebase SDK & Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
