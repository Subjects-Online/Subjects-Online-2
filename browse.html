<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Material — Subjects Online</title>
    <script src="js/page-transition.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sky: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9',
                            600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e'
                        }
                    },
                    fontFamily: {
                        heading: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
                        body: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/mobile-perf.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Subjects Online">
    <link rel="apple-touch-icon" href="images/icon-512.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f0f9ff; }
        ::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 999px; }

        body {
            background: #F0F9FF;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── HERO ── */
        .browse-hero {
            position: relative;
            padding: 120px 2rem 80px;
            text-align: center;
            overflow: hidden;
        }

        .browse-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(14,165,233,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 80% 100%, rgba(56,189,248,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(14,165,233,0.08);
            border: 1px solid rgba(14,165,233,0.2);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #0EA5E9;
            margin-bottom: 1.5rem;
        }

        .hero-badge-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #0EA5E9;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* We will reuse wi-heading from dashboard.css, removing inline browse-title overrides that clash */
        .browse-title {
            margin-bottom: 2rem; /* Adjusted for the new heading */
        }

        .browse-subtitle {
            color: #475569;
            font-size: 1rem;
            font-weight: 400;
            max-width: 460px;
            margin: 0 auto 3rem;
            line-height: 1.7;
        }

        /* ── SEARCH BAR ── */
        .search-wrap {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: #FFFFFF;
            border: 1.5px solid rgba(14,165,233,0.2);
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #0C1A2E;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(14,165,233,0.06);
        }

        .search-input::placeholder { color: #94A3B8; }

        .search-input:focus {
            border-color: #0EA5E9;
            box-shadow: 0 0 0 4px rgba(14,165,233,0.1), 0 4px 20px rgba(14,165,233,0.1);
        }

        /* ── GRID ── */
        .material-grid-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem 6rem;
        }

        .grid-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .grid-count {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748B;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        #material-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* ── CARD ── */
        .material-card {
            position: relative;
            background: #FFFFFF;
            border-radius: 24px;
            border: 1.5px solid rgba(14,165,233,0.1);
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .material-card:hover {
            transform: translateY(-6px);
            border-color: rgba(14,165,233,0.35);
            box-shadow: 0 20px 50px rgba(14,165,233,0.12), 0 4px 12px rgba(0,0,0,0.04);
        }

        /* Top gradient strip */
        .card-accent {
            height: 4px;
            width: 100%;
            flex-shrink: 0;
        }

        .card-inner {
            padding: 1.75rem 1.75rem 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* Card top row */
        .card-top-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .card-icon-wrap {
            width: 52px; height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            border: 1.5px solid;
            transition: transform 0.3s;
        }

        .material-card:hover .card-icon-wrap {
            transform: scale(1.1) rotate(-3deg);
        }

        .emoji-icon { line-height: 1; }

        /* Action buttons (Fav, Pin) */
        .action-btn {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: #F1F5F9;
            border: 1.5px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #CBD5E1;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background: rgba(14,165,233,0.1);
            border-color: rgba(14,165,233,0.4);
            color: #0EA5E9;
        }

        /* Content */
        .card-title {
            font-family: 'Plus Jakarta Sans', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0C1A2E;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            transition: color 0.2s;
        }

        .material-card:hover .card-title { color: #0EA5E9; }

        .card-desc {
            font-size: 0.85rem;
            color: #64748B;
            line-height: 1.65;
            flex: 1;
            margin-bottom: 1.5rem;
        }

        /* CTA row */
        .card-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1.5px solid;
            transition: all 0.25s;
            align-self: flex-start;
        }

        .material-card:hover .card-cta .icon-arrow {
            transform: translateX(3px);
        }

        .icon-arrow {
            transition: transform 0.25s;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            color: #94A3B8;
        }

        .empty-state svg {
            width: 64px; height: 64px;
            margin: 0 auto 1rem;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 1rem;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .browse-hero { padding: 100px 1.25rem 60px; }
            .material-grid-wrap { padding: 2rem 1.25rem 4rem; }
            #material-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <!-- Shared Navbar injected by JS -->

    <!-- Hero Section -->
    <section class="browse-hero relative z-10">
        <div class="hero-badge">
            <div class="hero-badge-dot"></div>
            Course Materials
        </div>
        <div class="wi-section" style="padding-top: 0; padding-bottom: 0;">
            <h1 class="wi-heading" style="margin-bottom: 1rem;">
                <span class="wi-word">Browse</span>
                <span class="wi-word wi-word-accent">Material</span>
            </h1>
            <div class="wi-divider" style="margin-bottom: 2rem;">
                <div class="wi-divider-line"></div>
            </div>
        </div>
        <p class="browse-subtitle" id="browse-subtitle">Loading your department's modules…</p>

        <!-- Search -->
        <div class="search-wrap">
            <svg class="search-icon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search subjects…" autocomplete="off">
        </div>
    </section>

    <!-- Cards Grid -->
    <div class="material-grid-wrap relative z-10">
        <div class="grid-header">
            <span class="grid-count" id="grid-count">—</span>
        </div>
        <div id="material-grid">
            <!-- injected by JS -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Firebase SDK & Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/shared-nav.js"></script>
    <script src="js/premium-effects.js"></script>
    <script src="js/data.js"></script>
    <script src="js/browse.js"></script>
    <script src="js/pwa.js"></script>

    <script>
        // Live search filter
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            if (!searchInput) return;
            searchInput.addEventListener('input', () => {
                const q = searchInput.value.toLowerCase();
                document.querySelectorAll('.material-card').forEach(card => {
                    const title = card.querySelector('.card-title')?.textContent.toLowerCase() || '';
                    const desc = card.querySelector('.card-desc')?.textContent.toLowerCase() || '';
                    card.style.display = (title.includes(q) || desc.includes(q)) ? '' : 'none';
                });
            });
        });
    </script>
</body>
</html>
