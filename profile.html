<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Subjects Online</title>

    <!-- Page Transition Script -->
    <script src="js/page-transition.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/mobile-perf.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1b3e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Subjects Online">
    <link rel="apple-touch-icon" href="images/icon-512.png">
</head>

<body class="bg-blue-50/30 text-slate-800 min-h-screen relative overflow-x-hidden antialiased">

    <!-- Ambient Background Glows -->
    <div
        class="glow-orb orb-1 fixed top-0 left-[-10%] w-[500px] h-[500px] bg-[radial-gradient(circle,rgba(56,189,248,0.15),transparent_70%)] rounded-full blur-3xl pointer-events-none -z-10">
    </div>
    <div
        class="glow-orb orb-2 fixed bottom-0 right-[-10%] w-[600px] h-[600px] bg-[radial-gradient(circle,rgba(59,130,246,0.1),transparent_70%)] rounded-full blur-3xl pointer-events-none -z-10">
    </div>

    <main class="page-content max-w-5xl mx-auto px-6 py-12 lg:py-16 relative z-10">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6 mb-12">
            <div>
                <h1 class="font-heading text-4xl font-bold text-blue-950 tracking-tight">Account Settings</h1>
                <p class="text-blue-600/80 mt-2 text-sm font-medium">Manage your profile and preferences across the
                    platform.</p>
            </div>
            <a href="dashboard.html"
                class="inline-flex items-center gap-2 bg-white/60 hover:bg-white/90 backdrop-blur-md border border-blue-200/50 text-blue-800 text-sm font-semibold py-2.5 px-6 rounded-full shadow-sm transition-all hover:shadow-md w-fit">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Dashboard
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <!-- Left Column: Profile Card -->
            <div class="lg:col-span-4 flex flex-col gap-6">
                <div
                    class="bg-white/40 backdrop-blur-2xl border border-white/60 shadow-[0_20px_40px_rgba(14,165,233,0.08)] rounded-[2rem] p-8 flex flex-col items-center text-center relative overflow-hidden">

                    <!-- Decorative Background for Card -->
                    <div
                        class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-br from-blue-500/10 to-transparent pointer-events-none">
                    </div>

                    <div class="relative group mt-4 mb-6">
                        <div
                            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-blue-400/40 rounded-full blur-[25px] animate-[pulse_3s_ease-in-out_infinite] pointer-events-none">
                        </div>
                        <div id="profile-avatar-display"
                            class="relative w-32 h-32 rounded-full mx-auto bg-gradient-to-br flex items-center justify-center text-5xl text-white font-bold shadow-[0_10px_25px_rgba(14,165,233,0.3)] border-4 border-white overflow-hidden bg-cover bg-center transition-transform duration-500 group-hover:scale-105 group-hover:rotate-3">
                            S
                        </div>

                        <!-- Upload Floating Button -->
                        <label
                            class="absolute bottom-0 right-0 bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full cursor-pointer shadow-lg transition-transform hover:scale-110 border-2 border-white">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                                </path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            <input type="file" id="avatar-upload" accept="image/*" class="hidden">
                        </label>
                    </div>

                    <h2 class="font-heading text-2xl font-bold text-blue-950 mb-1" id="display-profile-name">Student
                    </h2>
                    <span
                        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-100/50 text-blue-700 text-[10px] font-bold uppercase tracking-widest mb-6"
                        id="display-profile-dept">
                        Department
                    </span>

                    <button id="avatar-remove" type="button"
                        class="hidden w-full bg-red-50 hover:bg-red-100 text-red-600 border border-red-200/50 font-semibold py-3 px-4 rounded-xl text-sm transition-all flex items-center justify-center gap-2 mb-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                            </path>
                        </svg>
                        Remove Photo
                    </button>

                    <div class="w-full h-px bg-gradient-to-r from-transparent via-blue-200/60 to-transparent my-6">
                    </div>

                    <button type="button" id="logout-btn"
                        class="w-full bg-transparent hover:bg-red-50 text-slate-500 hover:text-red-600 font-semibold py-3 px-4 rounded-xl text-sm transition-all flex items-center justify-center gap-2 group">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Sign Out
                    </button>
                </div>
            </div>

            <!-- Right Column: Settings Form -->
            <div class="lg:col-span-8">
                <div
                    class="bg-white/50 backdrop-blur-3xl border border-white/70 shadow-[0_20px_50px_rgba(14,165,233,0.06)] p-8 sm:p-12 rounded-[2.5rem] relative overflow-hidden">
                    <form id="profile-form" class="flex flex-col gap-10 relative z-10">

                        <!-- Section: Personal Info -->
                        <div>
                            <h3
                                class="text-xs font-bold text-blue-900/80 uppercase tracking-widest mb-6 flex items-center gap-3">
                                <span
                                    class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
                                        </path>
                                    </svg>
                                </span>
                                Personal Details
                            </h3>
                            <div class="grid grid-cols-1 gap-6">
                                <!-- Full Name -->
                                <div>
                                    <label
                                        class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Full
                                        Name</label>
                                    <div class="relative group">
                                        <div
                                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-blue-400 group-focus-within:text-blue-600 transition-colors">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z">
                                                </path>
                                            </svg>
                                        </div>
                                        <input type="text" id="profile-name" required
                                            class="w-full bg-white/60 border border-white text-blue-950 text-sm rounded-2xl pl-12 pr-4 py-3.5 focus:outline-none focus:bg-white focus:border-blue-300 focus:ring-4 focus:ring-blue-400/10 transition-all shadow-sm"
                                            placeholder="e.g. Ahmed Tamer">
                                    </div>
                                </div>

                                <!-- Department -->
                                <div>
                                    <label
                                        class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Academic
                                        Department</label>
                                    <div class="relative group">
                                        <div
                                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-blue-400 group-focus-within:text-blue-600 transition-colors">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                                                </path>
                                            </svg>
                                        </div>
                                        <select id="profile-dept" required
                                            class="w-full bg-white/60 border border-white text-blue-950 text-sm rounded-2xl pl-12 pr-10 py-3.5 appearance-none focus:outline-none focus:bg-white focus:border-blue-300 focus:ring-4 focus:ring-blue-400/10 transition-all shadow-sm cursor-pointer">
                                            <option value="Accounting">Accounting</option>
                                            <option value="Business Administration">Business Administration</option>
                                            <option value="Economics">Economics</option>
                                            <option value="Statistics">Statistics</option>
                                            <option value="Political Science">Political Science</option>
                                            <option value="Financial & Customs Studies">Financial &amp; Customs Studies
                                            </option>
                                        </select>
                                        <div
                                            class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-blue-400">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="w-full h-px bg-gradient-to-r from-blue-100/50 via-blue-200/50 to-blue-100/50"></div>

                        <!-- Section: Preferences -->
                        <div>
                            <h3
                                class="text-xs font-bold text-blue-900/80 uppercase tracking-widest mb-6 flex items-center gap-3">
                                <span
                                    class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01">
                                        </path>
                                    </svg>
                                </span>
                                Interface Customization
                            </h3>
                            <div>
                                <label
                                    class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-4 ml-1">Avatar
                                    Color Theme</label>
                                <div class="flex flex-wrap gap-4" id="avatar-theme-selector">
                                    <button type="button" data-theme="blue"
                                        class="relative w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-400 shadow-[0_8px_20px_rgba(59,130,246,0.3)] transition-all transform hover:scale-110 hover:-translate-y-1 group border-2 border-transparent">
                                        <svg class="w-6 h-6 text-white absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity"
                                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7">
                                            </path>
                                        </svg>
                                    </button>
                                    <button type="button" data-theme="emerald"
                                        class="relative w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 opacity-60 hover:opacity-100 shadow-[0_8px_20px_rgba(16,185,129,0.3)] transition-all transform hover:scale-110 hover:-translate-y-1 group border-2 border-transparent">
                                        <svg class="w-6 h-6 text-white absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity"
                                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7">
                                            </path>
                                        </svg>
                                    </button>
                                    <button type="button" data-theme="rose"
                                        class="relative w-14 h-14 rounded-2xl bg-gradient-to-br from-rose-400 to-pink-500 opacity-60 hover:opacity-100 shadow-[0_8px_20px_rgba(244,63,94,0.3)] transition-all transform hover:scale-110 hover:-translate-y-1 group border-2 border-transparent">
                                        <svg class="w-6 h-6 text-white absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity"
                                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7">
                                            </path>
                                        </svg>
                                    </button>
                                    <button type="button" data-theme="violet"
                                        class="relative w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-600 opacity-60 hover:opacity-100 shadow-[0_8px_20px_rgba(139,92,246,0.3)] transition-all transform hover:scale-110 hover:-translate-y-1 group border-2 border-transparent">
                                        <svg class="w-6 h-6 text-white absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity"
                                            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7">
                                            </path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Area -->
                        <div class="mt-8 flex flex-col gap-3">
                            <button type="submit"
                                class="w-full bg-gradient-to-r from-blue-600 via-blue-500 to-cyan-500 hover:from-blue-700 hover:via-blue-600 hover:to-cyan-600 text-white font-bold py-4 px-6 rounded-2xl transition-all duration-300 shadow-[0_10px_30px_rgba(14,165,233,0.3)] hover:shadow-[0_15px_40px_rgba(14,165,233,0.4)] hover:-translate-y-1 flex justify-center items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                                    </path>
                                </svg>
                                Save Changes
                            </button>

                            <div id="success-msg"
                                class="hidden flex items-center justify-center gap-2 text-emerald-600 bg-emerald-50 border border-emerald-100 py-3 rounded-2xl font-medium text-sm animate-[fadeIn_0.3s_ease]">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                Profile updated successfully! Redirecting...
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Firebase SDK & Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/shared-nav.js"></script>
    <script src="js/premium-effects.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/pwa.js"></script>
</body>

</html>
