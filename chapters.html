<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Chapters — Subjects Online</title>
    <script src="js/page-transition.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{blue:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a',950:'#172554'},surface:'#ffffff'},fontFamily:{heading:['"Plus Jakarta Sans"','Georgia','serif'],body:['Inter','system-ui','sans-serif']}}}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/chapters.css">
    <link rel="stylesheet" href="css/mobile-perf.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1b3e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Subjects Online">
    <link rel="apple-touch-icon" href="images/icon-512.png"></head>
<body class="bg-surface font-body antialiased text-blue-900 min-h-screen relative overflow-x-hidden">

    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="glow-orb orb-1" style="opacity:0.10;"></div>
        <div class="glow-orb orb-2" style="opacity:0.10;"></div>
    </div>

    <!-- Navbar injected by JS -->

    <!-- ════════════════════════════════════════════════
         SAAS SPLIT LAYOUT
    ════════════════════════════════════════════════ -->
    <main class="relative z-10 w-full max-w-7xl mx-auto px-6 py-24 lg:py-32 flex flex-col lg:flex-row gap-10 items-start">
        
        <!-- Left Sidebar (Sticky) -->
        <aside class="w-full lg:w-1/3 flex-shrink-0 lg:sticky lg:top-32 flex flex-col gap-5">
            
            <!-- Navigation elements moved OUTSIDE the card -->
            <div class="flex items-center gap-4 px-2">
                <a href="javascript:history.back()" class="inline-flex items-center gap-2 text-blue-600 font-bold text-sm hover:text-blue-800 transition-colors group">
                    <span class="bg-white/60 backdrop-blur-md shadow-sm text-blue-600 p-2 rounded-full group-hover:-translate-x-1 transition-transform border border-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    </span>
                    Back
                </a>
                <div class="inline-block px-4 py-2 rounded-full bg-white/60 backdrop-blur-md border border-white shadow-sm text-blue-700 text-[10px] font-bold uppercase tracking-widest">
                    Course Content
                </div>
            </div>

            <!-- The Main Card -->
            <div class="bg-white/70 backdrop-blur-2xl border border-white/80 shadow-[0_20px_50px_rgba(14,165,233,0.08)] rounded-[2.5rem] p-8 lg:p-10 relative overflow-hidden flex flex-col items-center text-center">
                <!-- Decorative Glow inside sidebar -->
                <div class="absolute top-0 right-0 w-40 h-40 bg-blue-400/10 rounded-full blur-[30px] pointer-events-none -translate-y-1/2 translate-x-1/2"></div>
                <div class="absolute bottom-0 left-0 w-32 h-32 bg-cyan-400/10 rounded-full blur-[30px] pointer-events-none translate-y-1/2 -translate-x-1/2"></div>
                
                <!-- Circular Progress Bar -->
                <div class="relative w-36 h-36 mb-6" id="progress-ring-wrapper" style="cursor:pointer">
                    <!-- SVG Circle -->
                    <svg class="w-full h-full transform -rotate-90 drop-shadow-md" viewBox="0 0 100 100">
                        <!-- Background Track -->
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#e0f2fe" stroke-width="8" />
                        <!-- Progress Track -->
                        <circle id="circular-progress-bar" cx="50" cy="50" r="42" fill="none" stroke="url(#progress-gradient)" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" class="transition-all duration-1000 ease-out" />
                        <defs>
                            <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#0ea5e9" />
                                <stop offset="100%" stop-color="#38bdf8" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <!-- Center Content (Progress Percentage) -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="progress-text-circle" class="text-3xl font-heading font-bold text-blue-950">0%</span>
                        <span class="text-[9px] uppercase tracking-wider text-blue-500 font-bold mt-1">Completed</span>
                    </div>
                    <!-- Hover Breakdown Tooltip -->
                    <div id="progress-tooltip" style="
                        position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) scale(0.92);
                        background: rgba(255,255,255,0.97); backdrop-filter: blur(16px);
                        border: 1px solid rgba(14,165,233,0.15); border-radius: 16px;
                        padding: 12px 16px; min-width: 170px;
                        box-shadow: 0 12px 32px rgba(14,165,233,0.18), 0 2px 8px rgba(0,0,0,0.06);
                        opacity: 0; pointer-events: none;
                        transition: opacity 0.22s ease, transform 0.22s ease;
                        z-index: 100;
                    ">
                        <div style="font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#0ea5e9;margin-bottom:10px;display:flex;align-items:center;gap:5px;">
                            <svg width="10" height="10" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 010 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 010 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 010 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
                            Breakdown
                        </div>
                        <div style="display:flex;flex-direction:column;gap:8px;">
                            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <div style="width:8px;height:8px;border-radius:50%;background:#ef4444;"></div>
                                    <span style="font-size:11px;color:#64748b;font-weight:500;">PDFs</span>
                                </div>
                                <span id="tooltip-pdfs" style="font-size:12px;font-weight:800;color:#0f172a;">0 / 0</span>
                            </div>
                            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <div style="width:8px;height:8px;border-radius:50%;background:#0ea5e9;"></div>
                                    <span style="font-size:11px;color:#64748b;font-weight:500;">Videos</span>
                                </div>
                                <span id="tooltip-videos" style="font-size:12px;font-weight:800;color:#0f172a;">0 / 0</span>
                            </div>
                        </div>
                        <!-- Arrow -->
                        <div style="position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) rotate(45deg);width:13px;height:13px;background:rgba(255,255,255,0.97);border-right:1px solid rgba(14,165,233,0.15);border-bottom:1px solid rgba(14,165,233,0.15);"></div>
                    </div>
                </div>
                
                <!-- Subject Info -->
                <h1 id="chap-subj-title" class="font-heading text-4xl font-bold text-blue-950 mb-4 leading-tight tracking-tight">Loading...</h1>
                
                <p class="text-slate-500 text-sm leading-relaxed mb-8 font-medium">Master the material chapter by chapter with full detailed explanations and practical examples.</p>
                
                <!-- Lectures Count -->
                <div class="w-full flex items-center justify-center gap-2 text-xs text-blue-700 font-bold bg-blue-50/80 py-3.5 px-4 rounded-2xl border border-blue-100 shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
                    <span id="progress-count">0 of 0 lectures completed</span>
                </div>
            </div>
        </aside>

        <!-- Right Content (Chapters) -->
        <div class="w-full lg:w-2/3">
            <div id="timeline-container" class="flex flex-col gap-6">
                <!-- Injected by JS -->
            </div>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <!-- Firebase SDK & Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/shared-nav.js"></script>
    <script src="js/premium-effects.js"></script>
    <script src="js/data.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="js/chapters.js?v=2"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
